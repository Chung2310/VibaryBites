services:
  vibary-bites:
    image: ${IMAGE_REF:-vibary-bites:local}
    restart: unless-stopped
    # Bound this service so a traffic spike cannot consume the entire VPS.
    cpus: ${APP_CPU_LIMIT:-1.0}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    memswap_limit: ${APP_MEMORY_LIMIT:-512m}
    pids_limit: 128
    ports:
      - "${PORT:-3009}:${PORT:-3009}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=256}
      PORT: ${PORT:-3009}
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default_network:
    external: true
